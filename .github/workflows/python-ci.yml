name: Python CI (reusable)

env:
  UV_LOCKED: "1"

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against
        required: false
        type: string
        default: '["3.12", "3.13", "3.14"]'
      license-check-ignore:
        description: Space-separated list of packages to ignore in license check
        required: false
        type: string
        default: "certifi cookiecutter"

# Every job runs `uv` under UV_LOCKED=1, which refuses a uv.lock whose quarantine exceptions
# ([options.exclude-newer-package]) are not also in uv's configuration. The two steps after setup-uv fetch this
# repository at the commit of this workflow, let uv accept the lock's own exceptions, and fail the job when one
# of them is not in quarantine-exceptions.toml. See README.md, "Quarantine exceptions".

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - name: Fetch quarantine-exceptions.toml
        uses: actions/checkout@v7
        with:
          repository: eye2Gene/e2g-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .e2g-workflows
      - name: Allow the quarantine exceptions of uv.lock
        run: python3 .e2g-workflows/scripts/uv_quarantine_ci.py uv.lock .e2g-workflows/quarantine-exceptions.toml && rm -rf .e2g-workflows
      - run: uv sync
      - run: uv run just ci

  license-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - name: Fetch quarantine-exceptions.toml
        uses: actions/checkout@v7
        with:
          repository: eye2Gene/e2g-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .e2g-workflows
      - name: Allow the quarantine exceptions of uv.lock
        run: python3 .e2g-workflows/scripts/uv_quarantine_ci.py uv.lock .e2g-workflows/quarantine-exceptions.toml && rm -rf .e2g-workflows
      - run: uv sync
      - run: uv run just license-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch quarantine-exceptions.toml
        uses: actions/checkout@v7
        with:
          repository: eye2Gene/e2g-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .e2g-workflows
      - name: Allow the quarantine exceptions of uv.lock
        run: python3 .e2g-workflows/scripts/uv_quarantine_ci.py uv.lock .e2g-workflows/quarantine-exceptions.toml && rm -rf .e2g-workflows
      - run: uv sync
      - run: uv run just test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [ci, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - name: Fetch quarantine-exceptions.toml
        uses: actions/checkout@v7
        with:
          repository: eye2Gene/e2g-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .e2g-workflows
      - name: Allow the quarantine exceptions of uv.lock
        run: python3 .e2g-workflows/scripts/uv_quarantine_ci.py uv.lock .e2g-workflows/quarantine-exceptions.toml && rm -rf .e2g-workflows
      - run: uv run just build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
