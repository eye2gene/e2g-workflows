name: Python CI (reusable)

env:
  UV_LOCKED: "1"

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against
        required: false
        type: string
        default: '["3.12", "3.13"]'
      license-check-ignore:
        description: Space-separated list of packages to ignore in license check
        required: false
        type: string
        default: "certifi cookiecutter"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - run: uv sync
      - run: uv run just ci

  license-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - run: uv sync
      - run: uv run just license-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run just test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [ci, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@main
      - run: uv run just build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
