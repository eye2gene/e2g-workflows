name: Python project setup
description: >-
  The setup every job of python-ci.yml starts with, for a job a project writes itself: uv with the project's Python,
  uv configured for the quarantine exceptions the project's uv.lock records (the job fails when one of them is not
  in quarantine-exceptions.toml), then `uv sync`. Run it after actions/checkout.

inputs:
  python-version:
    description: The Python version setup-uv installs; the project's .python-version when empty
    required: false
    default: ""
  sync:
    description: Run `uv sync` after configuring uv ("true" or "false")
    required: false
    default: "true"
  sync-args:
    description: Extra arguments for `uv sync`, such as "--all-extras"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The cache keeps only the wheels uv built itself (`uv cache prune --ci`). setup-uv stopped pruning by default
    # in July 2026, and a project with torch then saved 3.4 GB per job: restoring it took longer than downloading
    # the wheels, and on 17 Nov a job that restored it downloaded torch again all the same and ran out of disk. The
    # suffix keeps the caches saved before the pruning from being restored.
    - uses: astral-sh/setup-uv@main
      with:
        python-version: ${{ inputs.python-version }}
        prune-cache: true
        cache-suffix: pruned

    # Every `uv` command of the job, from the sync below on, refuses a uv.lock that is not up to date instead of
    # rewriting it: the committed lock is what CI tests. python-ci.yml sets the same for its own jobs.
    - name: Enforce the committed uv.lock for the rest of the job
      shell: bash
      run: echo "UV_LOCKED=1" >> "$GITHUB_ENV"

    # The list is data, not code: it is read from main whatever version of this action runs, as `just up` reads it,
    # so a fix that `just allow` lets in reaches CI when its pull request merges, not with the next release. The
    # contents API, unlike raw.githubusercontent.com, serves no copy cached from before that merge.
    - name: Fetch the quarantine list from main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh api "repos/eye2Gene/e2g-workflows/contents/quarantine-exceptions.toml?ref=main"
        -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/quarantine-exceptions.toml"

    # The script comes with this action's checkout, at the ref it was called with: GITHUB_ACTION_PATH is
    # .github/actions/python-setup inside it
    - name: Allow the quarantine exceptions of uv.lock
      shell: bash
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/uv_quarantine_ci.py"
        uv.lock "$RUNNER_TEMP/quarantine-exceptions.toml"

    - name: uv sync
      if: inputs.sync == 'true'
      shell: bash
      env:
        UV_LOCKED: "1"
        SYNC_ARGS: ${{ inputs.sync-args }}
      run: uv sync $SYNC_ARGS # unquoted on purpose: several arguments
